name: Generar catálogo

on:
  push:
    branches: [ main ]
    paths:
      - 'guias/**'
      - 'generar_catalogo.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Correr generar_catalogo.py
        run: python3 generar_catalogo.py

      - name: Subir guias.js si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guias.js guias/
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que subir."
          else
            git commit -m "Actualizar catálogo automáticamente"
            git push
          fi
